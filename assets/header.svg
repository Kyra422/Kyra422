      <text x="96" y="65" fill="#e7d5a2" font-size="14" font-weight="600" letter-spacing="3">@KYRA422</text>
      <text x="74" y="201" fill="#c9ded5" font-size="23" letter-spacing="-.3">Aspiring game developer &amp; modding enthusiast</text>
      <text x="75" y="322" fill="#9cbdb4" font-size="11" font-weight="500" letter-spacing="3.2">EXPLORE · BUILD · PLAY</text>
      <text x="1118" y="337" fill="#c3d6c8" fill-opacity=".65" font-size="10" letter-spacing="2.5" text-anchor="end">SKYWARD</text>
    </g>
    <text class="serif" x="70" y="155" fill="#f6efdc" font-size="68" letter-spacing="-2.2">Hey, I'm <tspan fill="#dfc77a">Diego.</tspan></text>
    <path d="M75 230H642" stroke="url(#gold-line)" />
    <path d="M72 230L77 225L82 230L77 235Z" fill="#dfc77a" />
    <rect x="74" y="254" width="370" height="48" rx="5" fill="#05272a" fill-opacity=".67" stroke="#b9d8cf" stroke-opacity=".2" />
    <text class="mono" x="95" y="285" fill="#dfc77a" font-size="19">&gt;</text>
    <text class="mono" x="122" y="285" fill="#b1e5d7" font-size="19">games. mods. side quests.</text>
    <rect x="402" y="269" width="2" height="21" fill="#dfc77a" />
    <g fill="#d5eee5">
