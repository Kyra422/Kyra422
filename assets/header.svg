<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title description">
  <title id="title">Hey, I'm Diego — Skyward Sword-inspired GitHub profile</title>
  <desc id="description">A Skyward Sword-inspired sky of teal dusk, airy clouds, floating islands, and pale etched stone forms the static background for Diego's GitHub profile. Diego is an aspiring game developer and modding enthusiast.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#08272b" />
      <stop offset=".5" stop-color="#12383c" />
      <stop offset="1" stop-color="#416568" />
    </linearGradient>
    <radialGradient id="sky-light">
      <stop stop-color="#f1e4bb" stop-opacity=".19" />
      <stop offset=".5" stop-color="#ace2de" stop-opacity=".08" />
      <stop offset="1" stop-color="#ace2de" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#edecd4" />
      <stop offset=".5" stop-color="#c8d3c7" />
      <stop offset="1" stop-color="#94b4af" />
    </linearGradient>
    <linearGradient id="gold-line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#dfc77a" stop-opacity=".65" />
      <stop offset="1" stop-color="#dfc77a" stop-opacity="0" />
    </linearGradient>
    <clipPath id="canvas">
      <rect width="1200" height="380" rx="18" />
    </clipPath>
    <style>
      .sans { font-family: 'Segoe UI', Arial, sans-serif; }
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .mono { font-family: Consolas, 'Liberation Mono', monospace; }
    </style>
  </defs>
  <g clip-path="url(#canvas)">
    <rect width="1200" height="380" fill="url(#sky)" />
    <ellipse cx="966" cy="158" rx="350" ry="265" fill="url(#sky-light)" />
    <!-- Airborne silhouettes: stone platforms, green crowns, and clouds. -->
    <g opacity=".16">
      <path d="M753 117L791 109L820 118L803 128L790 147L778 136L771 122Z" fill="#aacac5" />
      <path d="M752 117Q766 107 778 112Q786 103 797 109Q809 108 820 118Z" fill="#c9dcc8" />
      <path d="M1090 144L1124 137L1169 145L1154 155L1138 184L1121 168L1114 154Z" fill="#aacac5" />
      <path d="M1090 144Q1104 132 1117 137Q1133 125 1143 136Q1156 132 1169 145Z" fill="#c9dcc8" />
      <path d="M1106 137V115H1114V137M1105 115L1110 107L1115 115Z" fill="#eef0d6" />
      <path d="M780 109V91H789V111M778 91H791L785 84Z" fill="#eef0d6" />
      <path d="M1044 62L1063 58L1081 64L1067 79L1055 72Z" fill="#b9d4cd" />
    </g>
    <g fill="#ddebe2">
      <path d="M729 195Q749 175 775 187Q792 175 812 189Q837 185 850 199Q792 208 729 195Z" opacity=".075" />
      <path d="M1058 207Q1084 187 1104 200Q1127 180 1153 199Q1174 191 1200 207V219Q1121 230 1058 207Z" opacity=".09" />
      <path d="M580 373Q647 337 717 354Q756 332 816 350Q850 328 892 348Q933 333 982 353Q1031 330 1088 350Q1141 331 1200 355V380H580Z" opacity=".12" />
      <path d="M720 379Q779 358 827 370Q873 344 918 364Q962 350 1003 372Q1061 347 1110 364Q1157 350 1200 373V380H720Z" opacity=".16" />
    </g>
    <!-- Pale stone edge, with restrained ancient geometric engraving. -->
    <rect x="15.5" y="15.5" width="1169" height="349" rx="8" fill="none" stroke="url(#stone)" stroke-opacity=".37" />
    <path d="M50 27H27V50M1150 27H1173V50M27 330V353H50M1150 353H1173V330" fill="none" stroke="#e5e5ca" stroke-opacity=".76" />
    <path d="M45 31H536M664 31H1155M45 349H536M664 349H1155" stroke="#dbe2cd" stroke-opacity=".15" />
